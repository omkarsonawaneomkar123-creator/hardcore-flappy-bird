name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixin-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          openjdk-17-jdk \
          autoconf \
          libtool \
          pkg-config \
          libffi-dev \
          libssl-dev
        pip install --upgrade pip
        pip install --upgrade buildozer "cython<3.0.0" setuptools

    - name: Build with Buildozer
      run: |
        buildozer -s android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HardcoreFlappyAPK
        path: bin/*.apk
